<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muro del Grupo</title>
  <link href="./src/output.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-8 font-sans">

  <div class="max-w-3xl mx-auto">
    <h1 class="text-4xl font-bold text-gray-900">Muro del Grupo</h1>
    <p class="text-gray-600 mt-1 mb-6">Recados de la clase</p>

    <ul class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
      <li class="bg-[#fef3c7] border border-amber-200 p-5 rounded-md shadow-sm min-h-[130px]">
        <b class="block text-gray-800 mb-1">Ana:</b>
        <span class="text-gray-700">¿Alguien tiene los apuntes de ayer?</span>
      </li>

      <li class="bg-[#d1fae5] border border-emerald-200 p-5 rounded-md shadow-sm min-h-[130px]">
        <b class="block text-gray-800 mb-1">Luis:</b>
        <span class="text-gray-700">El viernes hay torneo de fut.</span>
      </li>

      <li class="bg-[#dbeafe] border border-blue-200 p-5 rounded-md shadow-sm min-h-[130px]">
        <b class="block text-gray-800 mb-1">Sofía:</b>
        <span class="text-gray-700">¡Ya aprendí a usar la terminal!</span>
      </li>
    </ul>

    <button class="bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium px-4 py-2 rounded shadow-sm cursor-pointer">
      Publicar recado
    </button>
  </div>

</body>
</html>
